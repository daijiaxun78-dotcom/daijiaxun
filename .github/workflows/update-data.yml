name: Update fund data

on:
  push:
    branches: [main]
    paths:
      - "export_static.py"
      - "server.py"
      - "tests/**"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "15 1,5,9,13 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and export data
        run: python export_static.py --refresh
      - name: Validate exported data
        run: python -m unittest discover -s tests -v
      - name: Publish changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data.json
          git diff --cached --quiet || git commit -m "data: refresh fund snapshot"
          git push
